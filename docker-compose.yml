services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icewall-app
    restart: unless-stopped
    ports:
      - "4310:4310"
    env_file:
      # ← NÃO versionar este arquivo — criar um `.env.production` com seus valores
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4310
      - HOSTNAME=0.0.0.0
    volumes:
      - icewall_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icewall-net

  postgres:
    image: postgres:16-alpine
    container_name: icewall-postgres
    restart: unless-stopped
    env_file:
      # ← NÃO versionar — criar `.env.postgres` com POSTGRES_PASSWORD e DB_USER personalizados
      - .env.postgres
    environment:
      - POSTGRES_USER=${DB_USER:-icewall}
      - POSTGRES_DB=icewall_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-icewall} -d icewall_saas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - icewall-net

  redis:
    image: redis:7-alpine
    container_name: icewall-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - icewall-net

volumes:
  postgres_data:
  redis_data:
  icewall_data:

networks:
  icewall-net:
    driver: bridge
